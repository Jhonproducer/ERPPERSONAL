<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta y Contabilidad de IPs</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 20px;
        }
        h1, h2 {
            text-align: center;
        }
        table {
            width: 100%;
            max-width: 800px;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .status {
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
            color: #555;
        }
        button {
            display: block;
            margin: 0 auto 20px auto;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        /* Color distinto para la tabla de resumen */
        #tablaResumen th {
            background-color: #ff8800; 
        }
    </style>
</head>
<body>

    <h1>Consulta de ISP y ASN por IP</h1>
    
    <button id="btnConsultar" onclick="iniciarConsulta()">Iniciar Consulta</button>
    <div id="estado" class="status">Esperando para iniciar...</div>

    <!-- Tabla Principal -->
    <table id="tablaIps">
        <thead>
            <tr>
                <th>No.</th>
                <th>Dirección IP</th>
                <th>ISP / Organización</th>
                <th>ASN</th>
            </tr>
        </thead>
        <tbody>
            <!-- Los resultados aparecerán aquí -->
        </tbody>
    </table>

    <hr style="max-width: 800px; margin: 40px auto; border: 1px solid #ddd;">

    <!-- Tabla de Contabilidad (Resumen) -->
    <h2>Contabilidad por Empresa (ISP)</h2>
    <table id="tablaResumen">
        <thead>
            <tr>
                <th>ISP / Empresa</th>
                <th>Cantidad de IPs</th>
            </tr>
        </thead>
        <tbody>
            <!-- El resumen de cantidades aparecerá aquí -->
        </tbody>
    </table>

    <script>
        const token = "8c97cc52a98a48";
        const ips = [
            "86.172.94.228", "86.146.3.150", "82.36.48.127", "195.213.225.107",
            "82.44.55.67", "193.237.213.133", "94.6.16.99", "90.213.168.137",
            "90.197.158.137", "62.49.161.71", "86.159.221.110", "77.99.178.240",
            "151.229.197.21", "90.206.226.43", "86.176.150.147", "62.49.194.35",
            "86.160.20.72", "90.251.49.8", "84.67.98.222", "81.78.221.30",
            "151.229.71.67", "51.6.197.79", "81.174.166.32", "",
            "77.99.178.34", "81.111.7.96", "86.170.184.78", "109.146.76.168"
        ];

        async function iniciarConsulta() {
            const tbodyPrincipal = document.querySelector("#tablaIps tbody");
            const tbodyResumen = document.querySelector("#tablaResumen tbody");
            const estado = document.getElementById("estado");
            const btn = document.getElementById("btnConsultar");
            
            tbodyPrincipal.innerHTML = ""; // Limpiar tabla principal
            tbodyResumen.innerHTML = "";   // Limpiar tabla de resumen
            btn.disabled = true; // Desactivar botón

            // Objeto para llevar la contabilidad
            let contabilidadISP = {};
            
            for (let i = 0; i < ips.length; i++) {
                const ip = ips[i];
                const tr = document.createElement("tr");
                
                let tdNo = `<td>${i + 1}</td>`;
                let tdIp = `<td>${ip || "<strong>[VACÍA - Pendiente]</strong>"}</td>`;
                let tdIsp = `<td>Cargando...</td>`;
                let tdAsn = `<td>Cargando...</td>`;
                
                tr.innerHTML = tdNo + tdIp + tdIsp + tdAsn;
                tbodyPrincipal.appendChild(tr);

                estado.innerText = `Consultando IP ${i + 1} de ${ips.length}...`;

                if (ip !== "") {
                    try {
                        const response = await fetch(`https://ipinfo.io/${ip}/json?token=${token}`);
                        const data = await response.json();
                        
                        let orgFull = data.org || "No disponible";
                        let asn = "-";
                        let isp = orgFull;
                        
                        // Separar el ASN del nombre del ISP
                        if (orgFull.startsWith("AS")) {
                            let partes = orgFull.split(" ");
                            asn = partes[0];
                            isp = partes.slice(1).join(" "); // Todo lo que sigue al ASN es el nombre
                        }
                        
                        tr.cells[2].innerText = isp;
                        tr.cells[3].innerText = asn;

                        // === AQUÍ LLEVAMOS LA CONTABILIDAD ===
                        // Si el ISP ya existe en el contador, sumamos 1, si no, lo creamos con valor 1
                        if (contabilidadISP[isp]) {
                            contabilidadISP[isp]++;
                        } else {
                            contabilidadISP[isp] = 1;
                        }

                    } catch (error) {
                        tr.cells[2].innerText = "Error en consulta";
                        tr.cells[3].innerText = "-";
                    }
                } else {
                    tr.cells[2].innerText = "-";
                    tr.cells[3].innerText = "-";
                }
                
                // Pequeña pausa de 300 milisegundos para no saturar la API
                await new Promise(resolve => setTimeout(resolve, 300));
            }
            
            // === AL TERMINAR, DIBUJAMOS LA TABLA DE RESUMEN ===
            estado.innerText = "¡Consulta y Contabilidad finalizadas!";
            
            // Convertimos el objeto en un arreglo para poder ordenarlo de mayor a menor
            let arregloResultados = [];
            for (let empresa in contabilidadISP) {
                arregloResultados.push({
                    nombre: empresa,
                    cantidad: contabilidadISP[empresa]
                });
            }

            // Ordenamos de mayor a menor cantidad
            arregloResultados.sort((a, b) => b.cantidad - a.cantidad);

            // Creamos las filas en la tabla de resumen
            for (let item of arregloResultados) {
                const filaResumen = document.createElement("tr");
                filaResumen.innerHTML = `<td><strong>${item.nombre}</strong></td><td>${item.cantidad}</td>`;
                tbodyResumen.appendChild(filaResumen);
            }

            btn.disabled = false; // Reactivar el botón por si quieres consultar de nuevo
        }
    </script>
</body>
</html>
