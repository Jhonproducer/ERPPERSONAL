<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de IPs</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 20px;
        }
        h1 {
            text-align: center;
        }
        table {
            width: 100%;
            max-width: 800px;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .status {
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
            color: #555;
        }
        button {
            display: block;
            margin: 0 auto 20px auto;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <h1>Consulta de ISP y ASN por IP</h1>
    
    <button id="btnConsultar" onclick="iniciarConsulta()">Iniciar Consulta</button>
    <div id="estado" class="status">Esperando para iniciar...</div>

    <table id="tablaIps">
        <thead>
            <tr>
                <th>No.</th>
                <th>Dirección IP</th>
                <th>ISP / Organización</th>
                <th>ASN</th>
            </tr>
        </thead>
        <tbody>
            <!-- Los resultados aparecerán aquí -->
        </tbody>
    </table>

    <script>
        const token = "8c97cc52a98a48";
        const ips = [
            "86.172.94.228", "86.146.3.150", "82.36.48.127", "195.213.225.107",
            "82.44.55.67", "193.237.213.133", "94.6.16.99", "90.213.168.137",
            "90.197.158.137", "62.49.161.71", "86.159.221.110", "77.99.178.240",
            "151.229.197.21", "90.206.226.43", "86.176.150.147", "62.49.194.35",
            "86.160.20.72", "90.251.49.8", "84.67.98.222", "81.78.221.30",
            "151.229.71.67", "51.6.197.79", "81.174.166.32", "",
            "77.99.178.34", "81.111.7.96", "86.170.184.78", "109.146.76.168"
        ];

        async function iniciarConsulta() {
            const tbody = document.querySelector("#tablaIps tbody");
            const estado = document.getElementById("estado");
            const btn = document.getElementById("btnConsultar");
            
            tbody.innerHTML = ""; // Limpiar tabla
            btn.disabled = true; // Desactivar botón
            
            for (let i = 0; i < ips.length; i++) {
                const ip = ips[i];
                const tr = document.createElement("tr");
                
                let tdNo = `<td>${i + 1}</td>`;
                let tdIp = `<td>${ip || "<strong>[VACÍA - Pendiente]</strong>"}</td>`;
                let tdIsp = `<td>Cargando...</td>`;
                let tdAsn = `<td>Cargando...</td>`;
                
                tr.innerHTML = tdNo + tdIp + tdIsp + tdAsn;
                tbody.appendChild(tr);

                estado.innerText = `Consultando IP ${i + 1} de ${ips.length}...`;

                if (ip !== "") {
                    try {
                        const response = await fetch(`https://ipinfo.io/${ip}/json?token=${token}`);
                        const data = await response.json();
                        
                        let orgFull = data.org || "No disponible";
                        let asn = "-";
                        let isp = orgFull;
                        
                        // Separar el ASN del nombre del ISP
                        if (orgFull.startsWith("AS")) {
                            let partes = orgFull.split(" ");
                            asn = partes[0];
                            isp = partes.slice(1).join(" ");
                        }
                        
                        tr.cells[2].innerText = isp;
                        tr.cells[3].innerText = asn;

                    } catch (error) {
                        tr.cells[2].innerText = "Error en consulta";
                        tr.cells[3].innerText = "-";
                    }
                } else {
                    tr.cells[2].innerText = "-";
                    tr.cells[3].innerText = "-";
                }
                
                // Pequeña pausa para no saturar la API
                await new Promise(resolve => setTimeout(resolve, 300));
            }
            
            estado.innerText = "¡Consulta finalizada!";
            btn.disabled = false;
        }
    </script>
</body>
</html>
